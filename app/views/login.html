<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Usuario</title>
    <link rel="stylesheet" href="CSS/estilo2.css">
</head>
<body>
    <div class="login-container">
        <form class="login_form" action="index.php?controller=sistema&action=procesarLogin" method="POST">
            <h2>Sistema Gestion de Inventario Bonanza</h2>
            <p class="subtitle">introduce tus datos para ingresar.</p>
            
            <div class="input-group">
                <label for="username">Usuario o Correo</label>
                <input type="text" id="username" name="username" placeholder="Ej. usuario123" required>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" name ="login_form" value="1" class="btn-submit">Ingresar</button>

        </form>
    </div>
</body>
</html>
